<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Les Maudits — Access</title><link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,700&family=IBM+Plex+Mono:wght@400;500;600&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet"><link rel="stylesheet" href="styles.css"></head>
<body class="gate-body"><div class="gate-box"><div class="gate-eyebrow">Restricted Access — Les Maudits Institution</div><div class="gate-wordmark">LES M<span class="glitch" data-text="A">A</span>UDITS</div><div class="gate-tagline">AUTHORIZED PERSONNEL ONLY</div>
<form id="gate-form" autocomplete="off"><div class="member-login-fields"><label>NAME<select id="member-name" required><option value="">Select your name</option><option>William</option><option>Hopkins</option><option>JJ</option><option>Randy</option><option>Corneille</option><option>Val</option><option>Uriel</option></select></label><label>PASSWORD<input id="member-password" type="password" autocomplete="current-password" required placeholder="Enter your password"></label></div><button type="submit" class="gate-btn">ENTER INSTITUTION</button></form><div class="gate-status" id="gate-status"></div></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="auth.js"></script><script>
(async()=>{const {data:{session}}=await lmSupabase.auth.getSession();if(session&&lmMemberFromUser(session.user))location.replace('index.html');})();
document.getElementById('gate-form').addEventListener('submit',async e=>{e.preventDefault();const status=document.getElementById('gate-status'),name=document.getElementById('member-name').value,password=document.getElementById('member-password').value;if(!name||!password)return;status.textContent='VERIFYING…';status.className='gate-status';const email=name.toLowerCase()+'@lesmaudits.local';const {data,error}=await lmSupabase.auth.signInWithPassword({email,password});if(error||!data.user||lmMemberFromUser(data.user)!==name){if(data.session)await lmSupabase.auth.signOut();status.textContent='ACCESS DENIED';status.className='gate-status denied';document.getElementById('member-password').value='';return;}status.textContent='ACCESS GRANTED — '+name.toUpperCase();status.className='gate-status granted';setTimeout(()=>location.replace('index.html'),500);});
</script></body></html>
